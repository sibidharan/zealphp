name: io_uring

# Runs ZealPHP on OpenSwoole built with --enable-io-uring, on a GitHub VM
# (Docker containers on the default seccomp profile refuse io_uring, so this
# can't run in a container). Informational: not a required check.
#   baseline     stock OpenSwoole (epoll, thread-pool file I/O)
#   file-engine  io_uring build, default reactor: hooked file I/O uses io_uring
#   reactor      io_uring build + reactor_type=OPENSWOOLE_IO_URING everywhere
# The throughput job runs all three on ONE runner, alternating, because
# runner-to-runner variance (~40%) swamps any difference between jobs.
on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'
  pull_request:
    paths:
      - '.github/workflows/iouring.yml'
      - 'scripts/iouring/**'

permissions:
  contents: read

jobs:
  correctness:
    name: io_uring (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [baseline, file-engine, reactor]

    services:
      valkey:
        image: valkey/valkey:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      memcached:
        image: memcached:1.6-alpine
        ports:
          - 11211:11211
        options: >-
          --health-cmd "nc -z localhost 11211 || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "yes"
          MARIADB_DATABASE: zealtest
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check the kernel allows io_uring
        run: |
          uname -r
          echo "kernel.io_uring_disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo n/a)"
          python3 scripts/iouring/probe.py

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: uopz, redis, memcached, mysqli
          coverage: none
          tools: composer:v2

      - name: Build OpenSwoole v26.2.0, with and without io_uring
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev libc-ares-dev liburing-dev apache2-utils
          src="$RUNNER_TEMP/ext-openswoole"
          git clone --depth 1 --branch v26.2.0 https://github.com/openswoole/ext-openswoole.git "$src"
          cd "$src"
          test "$(git rev-parse 'HEAD^{commit}')" = 25daa6c02cd183cc576ab99e83a5f3682d1da682 || { echo "::error::openswoole v26.2.0 moved"; exit 1; }
          base="--enable-openssl --enable-hook-curl --enable-http2 --enable-mysqlnd --enable-sockets"
          for v in stock uring; do
            git clean -fdxq
            flags="$base"; [ "$v" = uring ] && flags="$flags --enable-io-uring"
            phpize >/dev/null && ./configure $flags >/dev/null && make -j"$(nproc)" >/dev/null
            cp modules/openswoole.so "$RUNNER_TEMP/openswoole-$v.so"
          done
          echo "OPENSWOOLE_SRC=$src" >> "$GITHUB_ENV"
          php -d extension=$RUNNER_TEMP/openswoole-uring.so --ri openswoole | grep -iE '^version|io_uring'

      - name: Build ext-zealphp
        run: |
          git submodule update --init ext/zealphp
          cd ext/zealphp
          phpize >/dev/null && ./configure --enable-zealphp >/dev/null && make -j"$(nproc)" >/dev/null
          cp modules/zealphp.so "$RUNNER_TEMP/zealphp.so"
          echo "ZEALPHP_SO=$RUNNER_TEMP/zealphp.so" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          # composer runs PHP without OpenSwoole; the platform check needs it declared.
          composer install --no-interaction --prefer-dist --ignore-platform-req=ext-openswoole

      - name: Load the build for this mode into every PHP process
        run: |
          ini_dir=$(php -i | awk -F'=> ' '/Scan this dir for additional .ini files/ {print $2}' | head -1 | tr -d ' ')
          so=openswoole-uring.so; [ "${{ matrix.mode }}" = baseline ] && so=openswoole-stock.so
          echo "extension=$RUNNER_TEMP/$so" | sudo tee "$ini_dir/30-openswoole.ini"
          echo "extension=$ZEALPHP_SO" | sudo tee "$ini_dir/50-zealphp.ini"
          if [ "${{ matrix.mode }}" = reactor ]; then
            echo "auto_prepend_file=$GITHUB_WORKSPACE/scripts/iouring/reactor-prepend.php" | sudo tee "$ini_dir/99-iouring-reactor.ini"
          fi
          php --ri openswoole | grep -iE '^version|io_uring' || true
          php -r 'OpenSwoole\Coroutine::run(fn() => print("event loop ok\n"));'

      - name: OpenSwoole's own io_uring tests
        if: matrix.mode != 'baseline'
        continue-on-error: true
        working-directory: ${{ env.OPENSWOOLE_SRC }}/tests
        # Their runner, not start.sh (it kills every .php process); PHPT=1 is
        # the guard their skipif checks.
        run: PHPT=1 php -d memory_limit=1024m ./run-tests openswoole_io_uring 2>&1 | grep -vE '^(PASS|SKIP) ' | tail -40

      - name: Start ZealPHP
        env:
          ZEALPHP_SKIP_DOCS_BUILD: '1'
          ZEALPHP_TEST_ROUTES: '1'
        run: |
          export ZEALPHP_APP_KEY="base64:$(php -r 'echo base64_encode(random_bytes(32));')"
          php app.php >/tmp/zealphp-server.log 2>&1 &
          echo $! > /tmp/zealphp-server.pid
          for i in $(seq 1 30); do
            curl -fsS -m 5 http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          echo "Server failed to start"; cat /tmp/zealphp-server.log; exit 1

      - name: Run tests (before any load)
        run: ./vendor/bin/phpunit

      - name: io_uring evidence
        if: always()
        run: sh scripts/iouring/evidence.sh | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Load probe (where does it stop answering?)
        if: always()
        continue-on-error: true
        timeout-minutes: 8
        run: |
          bash scripts/iouring/bench.sh "${{ matrix.mode }}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "--- server log tail"; tail -30 /tmp/zealphp-server.log

  throughput:
    name: io_uring throughput (one runner, alternating)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check the kernel allows io_uring
        run: |
          uname -r
          echo "kernel.io_uring_disabled=$(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo n/a)"
          python3 scripts/iouring/probe.py

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: uopz, redis, memcached, mysqli
          coverage: none
          tools: composer:v2

      - name: Build OpenSwoole v26.2.0, with and without io_uring
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev libssl-dev libc-ares-dev liburing-dev apache2-utils
          src="$RUNNER_TEMP/ext-openswoole"
          git clone --depth 1 --branch v26.2.0 https://github.com/openswoole/ext-openswoole.git "$src"
          cd "$src"
          test "$(git rev-parse 'HEAD^{commit}')" = 25daa6c02cd183cc576ab99e83a5f3682d1da682 || { echo "::error::openswoole v26.2.0 moved"; exit 1; }
          base="--enable-openssl --enable-hook-curl --enable-http2 --enable-mysqlnd --enable-sockets"
          for v in stock uring; do
            git clean -fdxq
            flags="$base"; [ "$v" = uring ] && flags="$flags --enable-io-uring"
            phpize >/dev/null && ./configure $flags >/dev/null && make -j"$(nproc)" >/dev/null
            cp modules/openswoole.so "$RUNNER_TEMP/openswoole-$v.so"
          done
          echo "OPENSWOOLE_SRC=$src" >> "$GITHUB_ENV"
          php -d extension=$RUNNER_TEMP/openswoole-uring.so --ri openswoole | grep -iE '^version|io_uring'

      - name: Build ext-zealphp
        run: |
          git submodule update --init ext/zealphp
          cd ext/zealphp
          phpize >/dev/null && ./configure --enable-zealphp >/dev/null && make -j"$(nproc)" >/dev/null
          cp modules/zealphp.so "$RUNNER_TEMP/zealphp.so"
          echo "ZEALPHP_SO=$RUNNER_TEMP/zealphp.so" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          # composer runs PHP without OpenSwoole; the platform check needs it declared.
          composer install --no-interaction --prefer-dist --ignore-platform-req=ext-openswoole

      - name: Alternate stock / file-engine / reactor, 3 rounds
        timeout-minutes: 20
        env:
          ZEALPHP_SKIP_DOCS_BUILD: '1'
        run: |
          for round in 1 2 3; do
            for v in stock file-engine reactor; do
              so=$RUNNER_TEMP/openswoole-uring.so; [ $v = stock ] && so=$RUNNER_TEMP/openswoole-stock.so
              mode=""; [ $v = reactor ] && mode=reactor
              if bash scripts/iouring/serve.sh start "$so" $mode; then
                bash scripts/iouring/bench.sh "r$round $v" | tee -a /tmp/bench.txt
              else
                echo "r$round $v: server did not start" | tee -a /tmp/bench.txt
              fi
              bash scripts/iouring/serve.sh stop
            done
          done
          { echo '```'; cat /tmp/bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
